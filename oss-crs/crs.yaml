name: rustmite
type:
- bug-finding
- harness-gen
version: 0.1.0
docker_registry: ghcr.io/andrewqchin/rustmite

# No prepare_phase: the runner builds FROM the framework-provided base_runner_image at
# run time and installs its own tooling (Rust + CBMC + miri + Node + Agent SDK).

# Rust-only. Each fuzzing engine gets its OWN build phase emitting an engine-specific
# harness under a distinct output key (build=libFuzzer, afl, honggfuzz) — OSS-Fuzz supports
# rust+AFL/honggfuzz natively via `cargo fuzz build` + CUSTOM_LIBFUZZER_PATH, so no bolero
# is needed for engine diversity. All are standalone $OUT binaries run-pov executes directly.
# The toolchain engines (Kani, Miri) run from /src in the runner (hence `src` is required).
target_build_phase:
- name: build
  dockerfile: oss-crs/dockerfiles/builder.Dockerfile
  outputs:
  - build
  - src
- name: afl-build
  dockerfile: oss-crs/dockerfiles/afl-builder.Dockerfile
  outputs:
  - afl
- name: honggfuzz-build
  dockerfile: oss-crs/dockerfiles/honggfuzz-builder.Dockerfile
  outputs:
  - honggfuzz
- name: coverage-build
  dockerfile: oss-crs/dockerfiles/coverage-builder.Dockerfile
  outputs:
  - coverage
- name: debug-build
  dockerfile: oss-crs/dockerfiles/debug-builder.Dockerfile
  outputs:
  - debug
- name: codeql-build
  dockerfile: oss-crs/dockerfiles/codeql-builder.Dockerfile
  outputs:
  - codeql

crs_run_phase:
  main:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile
    additional_env:
      # The TypeScript supervisor picks its top-level flow from $CRS_ENTRYPOINT (without
      # rebuilding the image). Default: the concurrent multi-engine supervisor.
      #   run            - fuzz ∥ kani ∥ miri ∥ harness-gen supervisor (default)
      #   run_fuzz_only  - fuzzing loop only (M0 parity / debugging)
      #   idle           - boot then sleep (docker exec in to drive crs-* tools by hand)
      CRS_ENTRYPOINT: run
      ANTHROPIC_MODEL: claude-opus-4-8
      # AGENT_TIMEOUT: "0"   # seconds, 0 = no limit (default)

supported_target:
  mode:
  - full
  - delta
  language:
  - rust
  sanitizer:
  - address
  architecture:
  - x86_64

# Validation baseline when an LLM proxy is configured (llm_config). Ignored when the
# CRS authenticates via CLAUDE_CODE_OAUTH_TOKEN.
required_llms:
- claude-opus-4-8
- claude-sonnet-4-6
